name: Check Calendar

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/calendar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/calendar/package-lock.json
      - name: Install system test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-ecal-2.0 gir1.2-edataserver-1.2
      - run: npm ci
      - run: npm run check
