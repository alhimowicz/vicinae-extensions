name: Check Chrome Profiles and DNF Packages

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extension: [chrome-profiles, dnf-packages]
    defaults:
      run:
        working-directory: extensions/${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/${{ matrix.extension }}/package-lock.json
      - run: npm ci
      - run: npx vici lint
      - run: npx tsc --noEmit
      - run: npx vici build --out dist/${{ matrix.extension }}
